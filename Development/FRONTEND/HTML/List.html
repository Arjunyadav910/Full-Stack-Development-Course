<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List In HTML</title>
</head>
<body>
    <!-- Unordered List -->
    <ul>
        <li>Bread</li>
        <li>Butter</li>
        <li>Bottle</li>
    </ul>

    <!-- Ordered List -->
    <ol type="A">
        <li>Bread</li>
        <li>Butter</li>
        <li>Bottle</li>
    </ol>
</body>
</html>
