<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Input Elements</title>
  </head>
  <body>
    <form action="/action">
      <div>
        <input type="checkbox" id="age" name="age" />
        <label for="age">I am 18+</label>
      </div>

      <div>
        <input type="radio" name="Fruit" id="apple" />
        <label for="apple">apple</label>
        <input type="radio" name="Fruit" id="mango" />
        <label for="mango">mango</label>
        <input type="radio" name="Fruit" id="orange" />
        <label for="orange">orange</label>
      </div>

      <div>
        <select name="Profession" id="Profession">
          <option value="stu">Student</option>
          <option value="dev">Developer</option>
        </select>
      </div>

      <div>
        <input type="range" name="vol" id="vol" min="0" max="100" />
        <label for="vol">Volume</label>
      </div>

      <div>
        <label for="feedback">Please provide your valuable feedback</label>
        <textarea id="feedback" name="feedback"></textarea>
      </div>
      <button>submit</button>
    </form>
  </body>
</html>
