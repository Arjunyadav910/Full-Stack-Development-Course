<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elements</title>
</head>
<body>
    <!-- Div Element -->
    <div>
        <a href="www.google.com">Google</a>
        <a href="www.youtube.com">Youtube</a>
    </div>
    <a href="www.instagram.com">Instagram</a>
    <hr />
    <!-- Span Element -->
     <span>
        <a href="www.google.com">Google</a>
        <a href="www.youtube.com">Youtube</a>
     </span>
     
</body>
</html>
